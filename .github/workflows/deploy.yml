name: Deploy SIAKAD Backend (SSH)

on:
  push:
    branches:
      - backend

jobs:
  deploy:
    name: Deploy to cPanel via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            git fetch origin backend
            git reset --hard origin/backend
            ${{ secrets.PHP_BIN || 'php' }} $(command -v composer || echo composer) install --no-dev --optimize-autoloader --no-interaction
            ${{ secrets.PHP_BIN || 'php' }} artisan config:clear
            ${{ secrets.PHP_BIN || 'php' }} artisan migrate --force
            ${{ secrets.PHP_BIN || 'php' }} artisan config:cache
            ${{ secrets.PHP_BIN || 'php' }} artisan route:cache
            ${{ secrets.PHP_BIN || 'php' }} artisan view:cache
            ${{ secrets.PHP_BIN || 'php' }} artisan l5-swagger:generate || true
            ${{ secrets.PHP_BIN || 'php' }} artisan queue:restart || true
