name: Deploy SIAKAD Backend (FTP Hosting)

on:
  push:
    branches:
      - backend

jobs:
  web-deploy:
    name: Build & Deploy to FTP Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, json, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Zip vendor for single-file upload
        run: |
          zip -rq vendor-deploy.zip vendor
          rm -rf vendor

      - name: Write deploy flag (current commit SHA)
        run: |
          mkdir -p storage/app
          echo "${{ github.sha }}" > storage/app/deploy.flag

      - name: Sync application files via FTP (excludes vendor + flag)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/siakad-backend/
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env
            phpunit.xml
            storage/app/deploy.flag

      - name: Upload vendor-deploy.zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/siakad-backend/
          local-dir: ./
          state-name: .ftp-deploy-sync-state-vendor.json
          exclude: |
            **
            !vendor-deploy.zip

      - name: Upload deploy flag last (triggers cron-deploy.php)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/siakad-backend/storage/app/
          local-dir: ./storage/app/
          state-name: .ftp-deploy-sync-state-flag.json
          exclude: |
            **
            !deploy.flag
