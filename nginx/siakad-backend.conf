# Nginx Virtual Host Configuration for siakad-backend Subdomain
# File Path on Server: /etc/nginx/sites-available/siakad-backend
# Enable with: sudo ln -s /etc/nginx/sites-available/siakad-backend /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name siakad-backend.yourdomain.com; # Ganti dengan domain/subdomain Anda

    # Path ke folder public Laravel
    root /var/www/siakad-backend/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Client upload size limit
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM Processor
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Sesuaikan versi PHP (misal php8.2-fpm.sock atau 127.0.0.1:9000)
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
